name: Release

# `git tag v0.1.0 && git push origin v0.1.0` で起動。
# macOS arm64 / macOS x86_64 / Linux x86_64 の 3 ターゲットでバイナリを焼き、
# tar.gz + sha256 を GitHub Release に upload する。Homebrew tap (kojira/homebrew-tmoe)
# の formula はこの Release から URL + sha256 を引いてくる前提。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag name to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build tmoe-cli (release)
        run: cargo build --release -p tmoe-cli --target ${{ matrix.target }} --locked

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          BIN_DIR="target/${TARGET}/release"
          STAGE="$(mktemp -d)/tmoe-${TAG}-${TARGET}"
          mkdir -p "$STAGE"
          cp "${BIN_DIR}/tmoe" "$STAGE/"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          cp config/tmoe.toml.example "$STAGE/" 2>/dev/null || true
          # strip (best effort; macOS strip is fine, Linux too)
          strip "$STAGE/tmoe" || true
          OUT="tmoe-${TAG}-${TARGET}.tar.gz"
          tar -C "$(dirname "$STAGE")" -czf "$OUT" "$(basename "$STAGE")"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$OUT" > "$OUT.sha256"
          else
            shasum -a 256 "$OUT" > "$OUT.sha256"
          fi
          ls -la "$OUT" "$OUT.sha256"
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"
          echo "ARTIFACT_SHA=$OUT.sha256" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmoe-${{ steps.ver.outputs.tag }}-${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT_SHA }}

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp -v {} out/ \;
          ls -la out/

      - name: Build per-target SHA256 summary (for formula)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## tmoe ${{ steps.ver.outputs.tag }} — Homebrew formula stanzas"
            echo
            echo '```ruby'
            for f in out/*.tar.gz; do
              base=$(basename "$f")
              sha=$(awk '{print $1}' "$f.sha256")
              echo "# $base"
              echo "sha256 \"$sha\""
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            out/*.tar.gz
            out/*.sha256

      # Formula/tmoe.rb の `version` と各 `sha256` を、リリースした成果物の値に書き換えて
      # main に commit + push する。これでユーザは `brew tap kojira/tmoe https://github.com/kojira/tmoe`
      # → `brew upgrade tmoe` するだけで新版が降りてくる。tap 用の別リポは不要。
      #
      # commit message に `[skip ci]` を入れて再起動を防ぐ (release.yml は tags にしか
      # 反応しないので元々ループしないが、将来 push トリガを足したときの保険)。
      - name: Update Formula/tmoe.rb with new version + sha256s
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${TAG#v}"

          # 各 target の sha256 を env vars に詰める (heredoc 内の bash 変数展開を避けて
          # python は os.environ 経由で読む — シェルが意図せず interpolation するのを防ぐ)。
          for f in out/*.tar.gz; do
            base=$(basename "$f" .tar.gz)
            target="${base#tmoe-${TAG}-}"
            sha=$(awk '{print $1}' "$f.sha256")
            echo "  $target -> $sha"
            case "$target" in
              aarch64-apple-darwin)     export SHA_ARM_MAC="$sha" ;;
              x86_64-apple-darwin)      export SHA_INTEL_MAC="$sha" ;;
              x86_64-unknown-linux-gnu) export SHA_LINUX="$sha" ;;
              *) echo "::warning::unknown target $target — ignoring" ;;
            esac
          done
          export VERSION

          python3 - <<'PY'
          import os, re, pathlib
          path = pathlib.Path("Formula/tmoe.rb")
          src = path.read_text()
          version = os.environ["VERSION"]
          shas = {
              "aarch64-apple-darwin":     os.environ.get("SHA_ARM_MAC", ""),
              "x86_64-apple-darwin":      os.environ.get("SHA_INTEL_MAC", ""),
              "x86_64-unknown-linux-gnu": os.environ.get("SHA_LINUX", ""),
          }

          src, n = re.subn(
              r'^(\s*version )"[^"]+"(\s*# tmoe:version)\s*$',
              lambda m: f'{m.group(1)}"{version}"{m.group(2)}',
              src,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit(f"version line not found (matches={n})")

          for target, sha in shas.items():
              if not sha:
                  raise SystemExit(f"missing sha256 for target: {target}")
              pat = re.compile(
                  r'^(\s*sha256 )"[0-9a-fA-F]*"(\s*# tmoe:sha:' + re.escape(target) + r')\s*$',
                  re.MULTILINE,
              )
              src, n = pat.subn(
                  lambda m: f'{m.group(1)}"{sha}"{m.group(2)}',
                  src,
              )
              if n != 1:
                  raise SystemExit(f"failed to update sha for {target} (matches={n})")
          path.write_text(src)
          print("Formula/tmoe.rb updated for", version)
          PY

          git config user.name  "tmoe-release-bot"
          git config user.email "tmoe-release-bot@users.noreply.github.com"
          if git diff --quiet -- Formula/tmoe.rb; then
            echo "Formula/tmoe.rb already at ${VERSION} — no commit"
            exit 0
          fi
          git add Formula/tmoe.rb
          git commit -m "Formula: bump tmoe to ${VERSION} [skip ci]"
          # tag push は detached HEAD なので、明示的に main に push する。
          git push origin "HEAD:refs/heads/main"
