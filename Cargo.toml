[workspace]
resolver = "2"
members = [
    "crates/tmoe-cli",
    "crates/tmoe-core",
    "crates/tmoe-llm",
    "crates/tmoe-tree",
    "crates/tmoe-rag",
    "crates/tmoe-history",
    "crates/tmoe-tools",
    "crates/tmoe-prompts",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/kojira/tmoe"

[workspace.dependencies]
tmoe-core = { path = "crates/tmoe-core" }
tmoe-llm = { path = "crates/tmoe-llm" }
tmoe-tree = { path = "crates/tmoe-tree" }
tmoe-rag = { path = "crates/tmoe-rag" }
tmoe-history = { path = "crates/tmoe-history" }
tmoe-tools = { path = "crates/tmoe-tools" }
tmoe-prompts = { path = "crates/tmoe-prompts" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
ulid = { version = "1", features = ["serde"] }
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
once_cell = "1"
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
walkdir = "2"
globset = "0.4"
regex = "1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
git2 = { version = "0.19", default-features = false, features = ["vendored-openssl"] }
toml = "0.8"
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
